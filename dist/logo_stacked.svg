<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <rect width="512" height="512" rx="64" fill="#0A0E17"/>

  <defs>
    <linearGradient id="sGrad" x1="140" y1="80" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="sGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo Centrado (Superior) -->
  <g transform="translate(16, -15)">
    <!-- Glow -->
    <g opacity="0.25" filter="url(#sGlow)">
      <path d="M 195 110 L 115 208 L 195 306" stroke="#38BDF8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 245 306 L 245 110 L 375 306 L 375 110" stroke="#38BDF8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- C (Bracket) -->
    <path d="M 195 110 L 115 208 L 195 306" stroke="url(#sGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- N (Monograma) -->
    <path d="M 245 306 L 245 110 L 375 306 L 375 110" stroke="#F8FAFC" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tipografía Centrada (Inferior) -->
  <text x="256" y="385" 
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="36" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#F8FAFC">CARLOS NOA</text>

  <text x="256" y="420" 
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        letter-spacing="3.5" 
        fill="#38BDF8">INGENIERO EN TECNOLOGÍAS DE LA INFORMACIÓN</text>
</svg>
