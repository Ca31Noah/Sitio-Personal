<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Squircle / Contenedor Dark Mode -->
  <rect width="512" height="512" rx="108" fill="#0A0E17"/>

  <defs>
    <linearGradient id="badgeTitleGrad" x1="120" y1="100" x2="390" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <filter id="badgeTitleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo (Centrado y ligeramente elevado) -->
  <g transform="translate(0, -28)">
    <g opacity="0.3" filter="url(#badgeTitleGlow)">
      <path d="M 195 136 L 96 256 L 195 376" stroke="#38BDF8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 256 376 L 256 136 L 416 376 L 416 136" stroke="#38BDF8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M 195 136 L 96 256 L 195 376" 
          stroke="url(#badgeTitleGrad)" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 256 376 L 256 136 L 416 376 L 416 136" 
          stroke="#F8FAFC" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Solo Descriptor Profesional Inferior (Sin "CARLOS NOA") -->
  <text x="256" y="435" 
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#38BDF8">INGENIERO EN TECNOLOGÍAS DE LA INFORMACIÓN</text>
</svg>
