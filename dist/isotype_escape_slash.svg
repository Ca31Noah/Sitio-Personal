<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 512" width="100%" height="100%" fill="none">
  <!-- Fondo Dark Mode -->
  <rect width="540" height="512" rx="96" fill="#0A0E17"/>

  <defs>
    <linearGradient id="escGrad" x1="60" y1="120" x2="480" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <filter id="glowEsc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glow Effect -->
  <g opacity="0.25" filter="url(#glowEsc)">
    <path d="M 155 140 L 70 256 L 155 372" stroke="#38BDF8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Backslash \ -->
    <line x1="205" y1="132" x2="275" y2="380" stroke="#38BDF8" stroke-width="30" stroke-linecap="round"/>
    <path d="M 315 372 L 315 140 L 455 372 L 455 140" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- C: Bracket < -->
  <path d="M 155 140 L 70 256 L 155 372" 
        stroke="url(#escGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Backslash \ (Salto de línea \n) -->
  <line x1="205" y1="132" x2="275" y2="380" 
        stroke="#38BDF8" 
        stroke-width="30" 
        stroke-linecap="round"/>

  <!-- N -->
  <path d="M 315 372 L 315 140 L 455 372 L 455 140" 
        stroke="#F8FAFC" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
