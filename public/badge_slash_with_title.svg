<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Contenedor Squircle Dark Mode -->
  <rect width="512" height="512" rx="108" fill="#0A0E17"/>

  <defs>
    <!-- Gradiente Cyan-Azure -->
    <linearGradient id="badgeSlashGrad" x1="80" y1="120" x2="430" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Glow Suave de Precisión -->
    <filter id="badgeSlashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo con Barra Diagonal </N (Centrado y ligeramente elevado) -->
  <g transform="translate(0, -28)">
    <!-- Glow -->
    <g opacity="0.3" filter="url(#badgeSlashGlow)">
      <!-- Bracket < -->
      <path d="M 145 145 L 68 256 L 145 367" stroke="#38BDF8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Barra / -->
      <line x1="185" y1="375" x2="255" y2="137" stroke="#38BDF8" stroke-width="28" stroke-linecap="round"/>
      <!-- N -->
      <path d="M 295 367 L 295 145 L 435 367 L 435 145" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bracket < (Letra C) -->
    <path d="M 145 145 L 68 256 L 145 367" 
          stroke="url(#badgeSlashGrad)" 
          stroke-width="30" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Barra de Cierre / de Sintaxis Web -->
    <line x1="185" y1="375" x2="255" y2="137" 
          stroke="#38BDF8" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Monograma N -->
    <path d="M 295 367 L 295 145 L 435 367 L 435 145" 
          stroke="#F8FAFC" 
          stroke-width="30" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Descriptor Profesional Inferior (Sin "CARLOS NOA") -->
  <text x="256" y="435" 
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#38BDF8">INGENIERO EN TECNOLOGÍAS DE LA INFORMACIÓN</text>
</svg>
