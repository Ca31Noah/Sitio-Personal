<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%" fill="none">
  <rect width="920" height="220" rx="32" fill="#0A0E17"/>

  <defs>
    <linearGradient id="hGrad" x1="50" y1="50" x2="190" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo (Izquierda) -->
  <g transform="translate(40, 20)">
    <!-- Glow -->
    <g opacity="0.25" filter="url(#hGlow)">
      <path d="M 68 48 L 32 90 L 68 132" stroke="#38BDF8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 90 132 L 90 48 L 148 132 L 148 48" stroke="#38BDF8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- C (Bracket) -->
    <path d="M 68 48 L 32 90 L 68 132" stroke="url(#hGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- N (Monograma) -->
    <path d="M 90 132 L 90 48 L 148 132 L 148 48" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divisor Vertical Minimalista -->
  <line x1="260" y1="55" x2="260" y2="165" stroke="#1E293B" stroke-width="2"/>

  <!-- Wordmark / Tipografía (Derecha) -->
  <g transform="translate(295, 0)">
    <!-- Nombre Principal -->
    <text x="0" y="102" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#F8FAFC">CARLOS NOA</text>
    
    <!-- Descriptor Profesional Oficial -->
    <text x="2" y="142" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="13" 
          font-weight="600" 
          letter-spacing="3.5" 
          fill="#38BDF8">INGENIERO EN TECNOLOGÍAS DE LA INFORMACIÓN</text>
  </g>
</svg>
