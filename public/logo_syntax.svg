<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <rect width="512" height="512" rx="64" fill="#090D16"/>
  <defs>
    <linearGradient id="cyanIndigo" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glow Effect -->
  <g opacity="0.25" filter="url(#glow)">
    <path d="M 210 120 L 95 256 L 210 392" stroke="#38BDF8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 260 392 L 260 120 L 390 392 L 390 120" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sharp Main Geometry: Syntax Monogram -->
  <!-- C: Opening Angle Bracket `<` -->
  <path d="M 210 120 L 95 256 L 210 392" stroke="url(#cyanIndigo)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- N: Pure modern dev lines, diagonal represents closing slash `/` -->
  <path d="M 260 392 L 260 120 L 390 392 L 390 120" stroke="#F8FAFC" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
