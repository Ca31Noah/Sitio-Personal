<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="100%" fill="none">
  <rect width="820" height="180" rx="28" fill="#0A0E17"/>

  <defs>
    <linearGradient id="cGrad" x1="40" y1="40" x2="180" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="cGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isotipo con la barra de sintaxis </N (Izquierda) -->
  <g transform="translate(36, 15)">
    <!-- Glow -->
    <g opacity="0.25" filter="url(#cGlow)">
      <path d="M 52 40 L 22 75 L 52 110" stroke="#38BDF8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="68" y1="112" x2="90" y2="38" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
      <path d="M 106 110 L 106 40 L 152 110 L 152 40" stroke="#38BDF8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- C: Bracket < -->
    <path d="M 52 40 L 22 75 L 52 110" stroke="url(#cGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / de cierre </N -->
    <line x1="68" y1="112" x2="90" y2="38" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    <!-- N -->
    <path d="M 106 110 L 106 40 L 152 110 L 152 40" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divisor Minimalista -->
  <line x1="230" y1="45" x2="230" y2="135" stroke="#1E293B" stroke-width="2"/>

  <!-- Nombre Puro sin subtítulo abajo -->
  <g transform="translate(265, 0)">
    <text x="0" y="105" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="48" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#F8FAFC">CARLOS NOA</text>
  </g>
</svg>
